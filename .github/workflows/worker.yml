# Runs the 3D worker on GitHub's free runners instead of a laptop.
# Every 15 minutes it works the queue in Neon for ~12 minutes, then exits cleanly.
# All secrets come from one repository secret, WORKER_ENV (the contents of worker/.env).
name: worker

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install worker
        run: pip install -r worker/requirements.txt

      - name: Cache Chromium and the cutout model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.u2net
          key: worker-models-${{ runner.os }}-${{ hashFiles('worker/requirements.txt') }}

      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium

      - name: Write worker/.env from the secret
        env:
          WORKER_ENV: ${{ secrets.WORKER_ENV }}
        run: |
          if [ -z "$WORKER_ENV" ]; then echo "WORKER_ENV secret is missing"; exit 1; fi
          printf '%s\n' "$WORKER_ENV" > worker/.env

      - name: Work the queue for 12 minutes
        # SIGINT = the worker's own Ctrl-C path: finish the current item, release locks, exit.
        run: timeout -s INT -k 90s 12m python -m worker.run --loop --stages seller,select,cutout,gen,export || [ $? -eq 124 ]
